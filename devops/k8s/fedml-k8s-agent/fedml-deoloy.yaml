apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedml-agent-endpoint-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedml-agent-endpoint-1
  template:
    metadata:
      labels:
        app: fedml-agent-endpoint-1
    spec:
      nodeName: kubeedge-dgx-134-rev1
      dnsConfig:
        nameservers:
          - 8.8.8.8
      containers:
      # fedml-agent is the fix container name that runs the fedml(master&slave)
      - name: fedml-agent
        image: fedml/fedml-k8s-agent:202501182000
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 22
          hostPort: 38022
        - containerPort: 32203
          hostPort: 32203
        env:
        - name: SSH_PUBLIC_KEY_SYSTEM
          value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIITAoK1DEXdsyB2UNZvZ5gPc0EJpn2V+gFLQTj18HsOz fedml@tensoropera.ai"
        - name: SSH_PUBLIC_KEY_USER
          value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG4JoJM7/x0zP4S3D85cTb9bdEl6u02W0QPHSmSZ0bbs yangliu@yanglius-MacBook-Pro.local"
        - name: MODEL_INFERENCE_PORT_IN_K8S
          value: "2204"
        - name: SCHEDULER_TYPE
          value: "K8S"
        - name: SCHEDULER_TASK_TYPE
          value: "DEPLOY"
        - name: FEDML_API_KEY
          value: ""
        - name: FEDML_ENV
          value: "test"
        - name: FEDML_PROVIDER
          value: "false"
        - name: FEDML_DEVICE_ID
          value: "edge-dgx-134-000001"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "none"
        resources:
          requests:
            nvidia.com/gpu: "0"
            cpu: "2"
            memory: "16Gi"
          limits:
            nvidia.com/gpu: "0"
            cpu: "2"
            memory: "16Gi"
        volumeMounts:
          - name: pod-logs
            mountPath: /var/log/pods
            readOnly: true
          - name: container-logs
            mountPath: /var/log/containers
            readOnly: true
          - name: containerd-sock
            mountPath: /run/containerd/containerd.sock
            readOnly: true
          - name: shared-model-dir
            mountPath: /root/.fedml/fedml-model-client/fedml/model_packages/current_model
      
        # container-task is fix container name that runs the task(training or inference)
      - name: container-task
        # image: fedml/fedml-inference-cuda-12-1-base:v20241129
        image: vllm/vllm-openai:v0.6.4
        ports:
        - containerPort: 2345
        # Scenario 1: use third party docker image(like openai vllm, only need to provide args)
        # args: ["$CONTAINER_RUN_COMMAND"]
        # Scenario 2: use fedml prebuilt docker image
        command: ["/bin/bash", "-c"]
        args:
          - |
            # echo "[$(date)] container-task starting - waiting for starting signal..."
            # attempt=1
            # while [ ! -f /home/fedml/models_serving/.ready ]; do
            #   echo "[$(date)] Check attempt $attempt: Ready signal not found, waiting..."
            #   attempt=$((attempt + 1))
            #   sleep 5
            # done
            # echo "[$(date)] ✓ Ready signal received after $((attempt - 1)) attempts!"
            
            # check if bootstrap dir is not empty
            if [ ! -z "${BOOTSTRAP_DIR}" ]; then
              echo "[$(date)] Executing bootstrap script from ${BOOTSTRAP_DIR}"
              source "${BOOTSTRAP_DIR}"
            fi
            
            # check if container_run_command or main_entry is not empty
            if [ ! -z "${CONTAINER_RUN_COMMAND}" ]; then
              echo "[$(date)] Executing CONTAINER_RUN_COMMAND: ${CONTAINER_RUN_COMMAND}"
              # check if the task image is vllm/vllm-openai
              if [[ "${TASK_IMAGE_NAME}" == *"vllm/vllm-openai"* ]]; then
                echo "[$(date)] Detected vllm/vllm-openai image, executing with vllm API server"
                python3 -m vllm.entrypoints.openai.api_server ${CONTAINER_RUN_COMMAND}
              else
                eval "${CONTAINER_RUN_COMMAND}"
              fi
            elif [ ! -z "${MAIN_ENTRY}" ]; then
              echo "[$(date)] Executing python3 ${MAIN_ENTRY}"
              python3 "${MAIN_ENTRY}"
            else
              echo "[$(date)] ERROR: Neither CONTAINER_RUN_COMMAND nor MAIN_ENTRY is provided!"
              exit 1
            fi
        env:
        # envs below is from fedml library
        - name: HF_TOKEN
          value: ""
        - name: FEDML_USER_ENCRYPTED_API_KEY
          value: ""
        - name: TASK_IMAGE_NAME
          value: "vllm/vllm-openai:v0.6.4"
        - name: CONTAINER_RUN_COMMAND
          value: "--model meta-llama/Llama-3.1-8B-Instruct --served-model-name Llama-3.1-8B-Instruct --tensor-parallel-size 1 --max-model-len 2048 --max-num-seqs 32 --use-v2-block-manager"
        - name: MAIN_ENTRY
          value: "main_openai_vllm.py"
        - name: HOME
          value: "/home/fedml"
        - name: BOOTSTRAP_DIR
          value: "/home/fedml/models_serving/fedml-deploy-bootstrap-entry-auto-gen.sh"
        - name: FEDML_CURRENT_EDGE_ID
          value: "0"
        - name: FEDML_CURRENT_RUN_ID
          value: "0"
        - name: FEDML_REPLICA_RANK
          value: "0"
        - name: FEDML_CURRENT_VERSION
          value: "test"
        - name: FEDML_ENV_VERSION
          value: "test"
        - name: FEDML_ENV_LOCAL_ON_PREMISE_PLATFORM_HOST
          value: "127.0.0.1"
        - name: FEDML_ENV_LOCAL_ON_PREMISE_PLATFORM_PORT
          value: "80"
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: shared-model-dir
            mountPath: /home/fedml/models_serving
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "32Gi"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                MODELS_SERVING_DIR="/home/fedml/models_serving"
                echo "[INFO] postStart exec start time: $(date)" >> $MODELS_SERVING_DIR/init_container.log
                # Find available Python command
                if command -v python3 >/dev/null 2>&1; then
                    PYTHON_CMD=python3
                elif command -v python >/dev/null 2>&1; then
                    PYTHON_CMD=python
                else
                    echo "[ERROR] Python not found in the system"
                    exit 0
                fi
                
                # Install GPUtil if needed
                echo "[INFO] Installing GPUtil, start time: $(date)" >> $MODELS_SERVING_DIR/init_container.log
                $PYTHON_CMD -m pip install gputil -i https://mirrors.aliyun.com/pypi/simple/ >/dev/null 2>&1 || echo "[WARN] Failed to install GPUtil"
                echo "[INFO] Installing GPUtil, end time: $(date)" >> $MODELS_SERVING_DIR/init_container.log
                
                # Create a Python script for periodic GPU monitoring
                cat > "${MODELS_SERVING_DIR}/init_container.py" << 'EOF'
                import GPUtil
                import json
                import os
                import time
                import sys
                from datetime import datetime
                
                def get_gpu_info():
                    try:
                        gpus = GPUtil.getGPUs()
                        return [{
                            "id": gpu.id,
                            "name": gpu.name,
                            "driver": gpu.driver,
                            "serial": gpu.serial,
                            "vendor": "NVIDIA",
                            "memoryTotal": gpu.memoryTotal,
                            "memoryFree": gpu.memoryFree,
                            "memoryUsed": gpu.memoryUsed,
                            "memoryUtil": gpu.memoryUtil,
                            "load": gpu.load,
                            "uuid": gpu.uuid,
                            "display_mode": gpu.display_mode,
                            "display_active": gpu.display_active,
                            "temperature": gpu.temperature
                        } for gpu in gpus]
                    except Exception as e:
                        print(f"[ERROR] Failed to get GPU info: {str(e)}", file=sys.stderr)
                        return None
                
                def write_gpu_info(info, filepath):
                    if info is not None:
                        try:
                            # Write to temporary file first
                            temp_file = f"{filepath}.tmp"
                            with open(temp_file, 'w') as f:
                                json.dump(info, f)
                            # Atomic rename
                            os.rename(temp_file, filepath)
                            print(f"[INFO] GPU information updated at {datetime.now().isoformat()}")
                        except Exception as e:
                            print(f"[ERROR] Failed to write GPU info: {str(e)}", file=sys.stderr)
                
                def main():
                    # 1. save container name to file
                    try:
                        with open('/etc/hostname', 'r') as f:
                            container_name = f.read().strip()
                        container_info_file = "/home/fedml/models_serving/.current_pod_name"
                        with open(container_info_file, 'w') as f:
                            f.write(container_name)
                        print(f"[INFO] Created container info file: {container_info_file}")
                    except Exception as e:
                        print(f"[ERROR] Failed to create container info file: {str(e)}", file=sys.stderr)
                    
                    # 2. save gpu info to file
                    gpu_info_output_file = "/home/fedml/models_serving/.gpu_info.json"
                    while True:
                        gpu_info = get_gpu_info()
                        write_gpu_info(gpu_info, gpu_info_output_file)
                        time.sleep(15)  # Update every 15 seconds
                
                if __name__ == "__main__":
                    main()
                EOF
                
                # Start the monitoring script in background
                nohup $PYTHON_CMD $MODELS_SERVING_DIR/init_container.py >> $MODELS_SERVING_DIR/init_container.log 2>&1 &
                echo $! > $MODELS_SERVING_DIR/init_container.pid
                echo "[INFO] postStart exec end time: $(date)" >> $MODELS_SERVING_DIR/init_container.log
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: container-logs
        hostPath:
          path: /var/log/containers
          type: Directory
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: shared-model-dir
        emptyDir: {}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedml-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedml-agent
  template:
    metadata:
      labels:
        app: fedml-agent
    spec:
      nodeName: edge-dgx-134
      dnsConfig:
        nameservers:
          - 8.8.8.8
      containers:
      - name: fedml-agent
        image: fedml/fedml-k8s-agent:202412282240
        imagePullPolicy: IfNotPresent
        env:
        - name: SCHEDULER_TYPE
          value: "K8S"
        - name: FEDML_API_KEY
          value: "de6aa755c9114534a9805dce8c702355"
        - name: FEDML_ENV
          value: "test"
        - name: FEDML_PROVIDER
          value: "false"
        - name: FEDML_DEVICE_ID
          value: "edge-dgx-134-000001"
        # - name: NVIDIA_VISIBLE_DEVICES
        #   value: "none"
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "16Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
          - name: shared-model-dir
            mountPath: /root/.fedml/fedml-model-client/fedml/model_packages/current_model
          - name: source-model-dir
            mountPath: /root/charlie
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "[$(date)] Waiting 5 seconds before copying files..." >> /proc/1/fd/1
                sleep 5
                echo "[$(date)] Copying files from source directory..." >> /proc/1/fd/1
                cp -r /root/charlie/2024-11-30-Meta-Llama-3-8B-Instruct1129_model_server/* /root/.fedml/fedml-model-client/fedml/model_packages/current_model/
                echo "[$(date)] Files copied successfully" >> /proc/1/fd/1
      - name: container-task
        image: fedml/fedml-inference-cuda-12-1-base:v20241129
        # image: nvidia/cuda:12.1.0-cudnn8-devel-ubuntu22.04
        ports:
        - containerPort: 2345
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "[$(date)] container-task starting - waiting for starting signal..."
            attempt=1
            while [ ! -f /home/fedml/models_serving/ready ]; do
              echo "[$(date)] Check attempt $attempt: Ready signal not found, waiting..."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "[$(date)] ✓ Ready signal received after $((attempt - 1)) attempts!"
            
            # if bootstrap dir is not empty, then use source command to run the bootstrap script
            source ${BOOTSTRAP_DIR}
            echo "[$(date)] Bootstrap script executed, starting the main entry..."
            python3 ${MAIN_ENTRY}
        env:
        - name: FEDML_USER_ENCRYPTED_API_KEY
          value: "818e7a4104d5d72c57c9be4b5af4f112f7d6f55c8ecba16f83d3a9f1a1a14f4d05741c93a72c59e2a8420811b140b983"
        - name: MAIN_ENTRY
          value: "main_openai_vllm.py"
        - name: HOME
          value: "/home/fedml"
        - name: BOOTSTRAP_DIR
          value: "/home/fedml/models_serving/fedml-deploy-bootstrap-entry-auto-gen.sh"
        - name: FEDML_CURRENT_EDGE_ID
          value: "7212"
        - name: FEDML_CURRENT_RUN_ID
          value: "3833"
        - name: FEDML_REPLICA_RANK
          value: "0"
        - name: FEDML_CURRENT_VERSION
          value: "test"
        - name: FEDML_ENV_VERSION
          value: "test"
        - name: FEDML_ENV_LOCAL_ON_PREMISE_PLATFORM_HOST
          value: "127.0.0.1"
        - name: FEDML_ENV_LOCAL_ON_PREMISE_PLATFORM_PORT
          value: "80"
        - name: HF_HOME
          value: "/home/fedml/fedml_serving/model_and_config"
        - name: HF_TOKEN
          value: "config/huggingface/DEFAULT_HF_TOKEN"
        - name: INFERENCE_CONFIG
          value: "config/inference/meta-llama--Meta-Llama-3-8B-Instruct.yaml"
        volumeMounts:
          - name: shared-model-dir
            mountPath: /home/fedml/models_serving
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "32Gi"
          requests:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "32Gi"

      volumes:
      - name: shared-model-dir
        emptyDir: {}
      - name: source-model-dir
        hostPath:
          path: /root/charlie
          type: Directory
      
      
      # Required for NVIDIA GPU support
      # nodeSelector:
      #   nvidia.com/gpu: "true"